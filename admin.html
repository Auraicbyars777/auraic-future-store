<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>AURAIC | Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071426;
      color: #fff;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      margin: 7px 0 15px;
      padding: 12px;
      border: 1px solid #30435d;
      border-radius: 8px;
      background: #101f33;
      color: #fff;
    }

    label {
      font-size: 13px;
      color: #b8c8dd;
    }

    .primary {
      background: #58a6ff;
      color: #061426;
    }

    .secondary {
      background: #24364d;
      color: #fff;
    }

    .danger {
      background: #ff5364;
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
      padding: 25px 0 60px;
    }

    .brand {
      color: #58a6ff;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .muted {
      color: #9aacc4;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .card {
      margin-top: 22px;
      padding: 22px;
      border: 1px solid #24364d;
      border-radius: 14px;
      background: #0d1b2e;
    }

    .login {
      max-width: 430px;
      margin: 70px auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .product, .order {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid #30435d;
      border-radius: 10px;
      background: #101f33;
      overflow-wrap: anywhere;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: white;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .price {
      color: #75b7ff;
      font-size: 20px;
      font-weight: bold;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 12px;
    }

    .message {
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      background: #132a43;
      color: #b8d9ff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .image-preview {
      width: 120px;
      max-height: 150px;
      object-fit: contain;
      display: none;
      margin-bottom: 15px;
      background: white;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
      }

      .card {
        padding: 16px;
      }

      .login {
        margin-top: 35px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- ADMIN LOGIN -->
    <section id="loginSection" class="card login">
      <div class="brand">AURAIC</div>
      <p class="muted">SECURE ADMIN ACCESS</p>

      <form id="loginForm">
        <label for="username">Admin username</label>
        <input id="username" autocomplete="username" required>

        <label for="password">Admin password</label>
        <input id="password" type="password"
               autocomplete="current-password" required>

        <button class="primary" type="submit" style="width:100%">
          LOGIN
        </button>
      </form>

      <div id="loginMessage" class="message hidden"></div>
    </section>

    <!-- ADMIN DASHBOARD -->
    <section id="dashboard" class="hidden">
      <header class="topbar">
        <div>
          <div class="brand">AURAIC</div>
          <p class="muted">ADMIN DASHBOARD</p>
        </div>

        <button id="logoutButton" class="danger">Logout</button>
      </header>

      <div id="dashboardMessage" class="message hidden"></div>

      <!-- ADD / EDIT PRODUCT -->
      <section class="card">
        <h2 id="formHeading">Add Product</h2>

        <form id="productForm">
          <input id="productId" type="hidden">

          <label for="productName">Product name *</label>
          <input id="productName" maxlength="120" required>

          <label for="productPrice">Price (₹) *</label>
          <input id="productPrice" type="number"
                 min="0.01" step="0.01" required>

          <label for="productDescription">Description</label>
          <textarea id="productDescription" rows="3"
                    maxlength="2000"></textarea>

          <label for="productImage">Front Photo *</label>
          <input id="productImage" type="file"
                 accept="image/*">
          <img id="frontPreview" class="image-preview" alt="Front preview">

          <label for="productBackImage">Back Photo</label>
          <input id="productBackImage" type="file"
                 accept="image/*">
          <img id="backPreview" class="image-preview" alt="Back preview">

          <label for="productColor">Colour</label>
          <input id="productColor" maxlength="100">

          <label for="productSizes">Sizes (comma-separated)</label>
          <input id="productSizes" maxlength="200"
                 placeholder="S, M, L, XL">

          <label for="productStock">Stock quantity *</label>
          <input id="productStock" type="number" min="0"
                 step="1" value="0" required>

          <div class="actions">
            <button class="primary" type="submit">Save Product</button>
            <button id="cancelEdit" class="secondary hidden"
                    type="button">Cancel Edit</button>
          </div>
        </form>
      </section>

      <!-- PRODUCTS -->
      <section class="card">
        <h2>Products</h2>
        <button id="refreshProducts" class="secondary" type="button">
          Refresh Products
        </button>
        <div id="productsList" class="muted">Loading products...</div>
      </section>

      <!-- ORDERS -->
      <section class="card">
        <h2>Customer Orders</h2>
        <button id="refreshOrders" class="secondary" type="button">
          Refresh Orders
        </button>
        <div id="ordersList" class="muted">Loading orders...</div>
      </section>
    </section>
  </main>
      <script>
const $ = id => document.getElementById(id);

let products = [];
let editingFrontImage = "";
let editingBackImage = "";

const CLOUD_NAME = "vdqrpjye";
const UPLOAD_PRESET = "auraic_upload";

const API_BASE = "";

function showMessage(id, text) {
  const el = $(id);
  el.textContent = text;
  el.classList.remove("hidden");
}

function clearMessage(id) {
  $(id).textContent = "";
  $(id).classList.add("hidden");
}

async function api(url, options = {}) {
  const response = await fetch(API_BASE + url, {
    ...options,
    credentials: "include",
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.message || data.error || "Request failed");
  }

  return data;
}

// CLOUDINARY PHOTO UPLOAD
async function uploadToCloudinary(file) {
  if (!file) return "";

  if (!file.type.startsWith("image/")) {
    throw new Error("Please select a valid image.");
  }

  if (file.size > 5 * 1024 * 1024) {
    throw new Error("Image must be smaller than 5 MB.");
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);
  formData.append("folder", "auraic-products");

  const response = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
    {
      method: "POST",
      body: formData
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error?.message || "Photo upload failed.");
  }

  return data.secure_url;
}

// IMAGE PREVIEW
function setupPreview(inputId, previewId) {
  $(inputId).addEventListener("change", event => {
    const file = event.target.files[0];
    const preview = $(previewId);

    if (!file) return;

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  });
}

setupPreview("productImage", "frontPreview");
setupPreview("productBackImage", "backPreview");

// LOGIN
$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage("loginMessage");

  try {
    await api("/api/admin/login", {
      method: "POST",
      body: JSON.stringify({
        username: $("username").value,
        password: $("password").value
      })
    });

    $("loginSection").classList.add("hidden");
    $("dashboard").classList.remove("hidden");

    await loadProducts();
    await loadOrders();

  } catch (error) {
    showMessage("loginMessage", error.message);
  }
});

// LOGOUT
$("logoutButton").addEventListener("click", async () => {
  try {
    await api("/api/admin/logout", {
      method: "POST",
      body: JSON.stringify({})
    });
  } catch (error) {
    console.log(error);
  }

  $("dashboard").classList.add("hidden");
  $("loginSection").classList.remove("hidden");
});

// LOAD PRODUCTS
async function loadProducts() {
  try {
    const data = await api("/api/products");

    products = Array.isArray(data)
      ? data
      : data.products || [];

    renderProducts();

  } catch (error) {
    $("productsList").textContent = error.message;
  }
}

// DISPLAY PRODUCTS
function renderProducts() {
  const list = $("productsList");
  list.innerHTML = "";

  if (!products.length) {
    list.textContent = "No products found.";
    return;
  }

  products.forEach(product => {
    const item = document.createElement("div");
    item.className = "product";

    const image = document.createElement("img");
    image.src = product.image || "";
    image.alt = product.name || "Product";
    image
  // RESET PRODUCT FORM
function resetProductForm() {
  $("productForm").reset();

  $("productId").value = "";
  $("formHeading").textContent = "Add Product";

  editingFrontImage = "";
  editingBackImage = "";

  $("frontPreview").src = "";
  $("backPreview").src = "";

  $("frontPreview").style.display = "none";
  $("backPreview").style.display = "none";

  $("cancelEdit").classList.add("hidden");
}

// ADD / UPDATE PRODUCT
$("productForm").addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage("dashboardMessage");

  const id = $("productId").value;
  const frontFile = $("productImage").files[0];
  const backFile = $("productBackImage").files[0];

  try {
    let frontImage = editingFrontImage;
    let backImage = editingBackImage;

    if (frontFile) {
      showMessage("dashboardMessage", "Uploading front photo...");
      frontImage = await uploadToCloudinary(frontFile);
    }

    if (!frontImage) {
      throw new Error("Front photo select cheyyuka.");
    }

    if (backFile) {
      showMessage("dashboardMessage", "Uploading back photo...");
      backImage = await uploadToCloudinary(backFile);
    }

    const product = {
      name: $("productName").value.trim(),
      description: $("productDescription").value.trim(),
      price: Number($("productPrice").value),
      image: frontImage,
      back_image: backImage,
      color: $("productColor").value.trim(),
      sizes: $("productSizes").value
        .split(",")
        .map(size => size.trim())
        .filter(Boolean),
      stock: Number($("productStock").value)
    };

    const url = id
      ? "/api/admin/products/" + encodeURIComponent(id)
      : "/api/admin/products";

    showMessage("dashboardMessage", "Saving product...");

    await api(url, {
      method: id ? "PUT" : "POST",
      body: JSON.stringify(product)
    });

    resetProductForm();

    showMessage("dashboardMessage", "Product saved successfully!");

    await loadProducts();

  } catch (error) {
    showMessage("dashboardMessage", error.message);
  }
});

// EDIT PRODUCT
function editProduct(product) {
  $("productId").value = product.id;
  $("productName").value = product.name || "";
  $("productDescription").value = product.description || "";
  $("productPrice").value = product.price || "";
  $("productColor").value = product.color || "";
  $("productSizes").value = Array.isArray(product.sizes)
    ? product.sizes.join(", ")
    : "";
  $("productStock").value = product.stock ?? 0;

  editingFrontImage = product.image || "";
  editingBackImage = product.back_image || "";

  if (editingFrontImage) {
    $("frontPreview").src = editingFrontImage;
    $("frontPreview").style.display = "block";
  }

  if (editingBackImage) {
    $("backPreview").src = editingBackImage;
    $("backPreview").style.display = "block";
  }

  $("formHeading").textContent = "Edit Product";
  $("cancelEdit").classList.remove("hidden");

  $("productForm").scrollIntoView({
    behavior: "smooth"
  });
}

// CANCEL EDIT
$("cancelEdit").addEventListener("click", resetProductForm);

// DELETE PRODUCT
async function deleteProduct(id) {
  if (!confirm("Are you sure you want to delete this product?")) {
    return;
  }

  try {
    await api(
      "/api/admin/products/" + encodeURIComponent(id),
      {
        method: "DELETE"
      }
    );

    showMessage("dashboardMessage", "Product deleted successfully!");
    await loadProducts();

  } catch (error) {
    showMessage("dashboardMessage", error.message);
  }
}

// LOAD ORDERS
async function loadOrders() {
  try {
    const data = await api("/api/admin/orders");

    const orders = Array.isArray(data)
      ? data
      : data.orders || [];

    const list = $("ordersList");
    list.innerHTML = "";

    if (!orders.length) {
      list.textContent = "No orders found.";
      return;
    }

    orders.forEach(order => {
      const item = document.createElement("div");
      item.className = "order";

      const heading = document.createElement("h3");
      heading.textContent = "Order #" + order.id;

      const details = document.createElement("p");
      details.className = "muted";
      details.textContent =
        "Customer: " + (order.customer_name || "N/A") +
        "\nStatus: " + (order.status || "N/A") +
        "\nTotal: ₹" + (order.total || order.total_amount || 0);

      item.append(heading, details);
      list.appendChild(item);
    });

  } catch (error) {
    $("ordersList").textContent = error.message;
  }
}

// REFRESH BUTTONS
$("refreshProducts").addEventListener("click", loadProducts);
$("refreshOrders").addEventListener("click", loadOrders);

</script>
</body>
</html>
