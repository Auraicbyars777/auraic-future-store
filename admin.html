<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>AURAIC | Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #071426;
      color: #fff;
      min-height: 100vh;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 7px 0 14px;
      background: #101f33;
      color: white;
      border: 1px solid #30435d;
      border-radius: 8px;
    }

    label {
      font-size: 13px;
      color: #b8c8dd;
    }

    .primary {
      background: #58a6ff;
      color: #061426;
    }

    .danger {
      background: #ff5364;
      color: white;
    }

    .secondary {
      background: #24364d;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
      padding: 28px 0 60px;
    }

    .brand {
      color: #58a6ff;
      letter-spacing: 5px;
      font-size: 25px;
      font-weight: 900;
    }

    .subtitle {
      color: #9aacc4;
      margin-top: 8px;
      font-size: 14px;
    }

    .card {
      background: #0d1b2e;
      border: 1px solid #24364d;
      border-radius: 14px;
      padding: 22px;
      margin-top: 22px;
    }

    .login {
      max-width: 420px;
      margin: 80px auto;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 18px;
    }

    h3 {
      margin-bottom: 12px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .product, .order {
      background: #101f33;
      border: 1px solid #30435d;
      border-radius: 10px;
      padding: 16px;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #fff;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .muted {
      color: #9aacc4;
      font-size: 13px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      background: #132a43;
      color: #b8d9ff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .price {
      color: #75b7ff;
      font-size: 19px;
      font-weight: bold;
      margin: 8px 0;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .container {
        padding-top: 20px;
      }

      .login {
        margin-top: 45px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- LOGIN -->
    <section id="loginSection" class="card login">
      <div class="brand">AURAIC</div>
      <p class="subtitle">SECURE ADMIN ACCESS</p>

      <form id="loginForm" style="margin-top:25px">
        <label for="username">Admin username</label>
        <input id="username" autocomplete="username" required>

        <label for="password">Admin password</label>
        <input id="password" type="password"
               autocomplete="current-password" required>

        <button class="primary" style="width:100%" type="submit">
          LOGIN TO DASHBOARD
        </button>
      </form>

      <div id="loginMessage" class="message hidden"></div>
    </section>

    <!-- DASHBOARD -->
    <section id="dashboard" class="hidden">
      <header class="topbar">
        <div>
          <div class="brand">AURAIC</div>
          <p class="subtitle">ADMIN DASHBOARD</p>
        </div>

        <button id="logoutButton" class="danger">Logout</button>
      </header>

      <div id="dashboardMessage" class="message hidden"></div>

      <section class="card">
        <h2 id="formHeading">Add New Product</h2>

        <form id="productForm">
          <input id="productId" type="hidden">

          <label for="productName">Product name *</label>
          <input id="productName" maxlength="120" required>

          <label for="productPrice">Price in ₹ *</label>
          <input id="productPrice" type="number"
                 min="0.01" step="0.01" required>

          <label for="productDescription">Description</label>
          <textarea id="productDescription" rows="3"
                    maxlength="2000"></textarea>

          <label for="productImage">Front image URL *</label>
          <input id="productImage" type="url" maxlength="1000" required
                 placeholder="https://example.com/front.jpg">

          <label for="productBackImage">Back image URL</label>
          <input id="productBackImage" type="url" maxlength="1000"
                 placeholder="https://example.com/back.jpg">

          <label for="productColor">Colour</label>
          <input id="productColor" maxlength="100">

          <label for="productSizes">Sizes (comma-separated)</label>
          <input id="productSizes" maxlength="200"
                 placeholder="S, M, L, XL">

          <label for="productStock">Stock quantity</label>
          <input id="productStock" type="number" min="0" step="1" value="0">

          <div class="actions">
            <button class="primary" type="submit">Save Product</button>
            <button class="secondary hidden" id="cancelEdit"
                    type="button">Cancel Edit</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Products</h2>
        <div id="productsList">Loading products...</div>
      </section>

      <section class="card">
        <h2>Customer Orders</h2>
        <button id="refreshOrders" class="secondary" type="button">
          Refresh Orders
        </button>
        <div id="ordersList">Click refresh to load orders.</div>
      </section>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    let csrfToken = "";
    let products = [];

    function showMessage(id, text) {
      const el = $(id);
      el.textContent = text;
      el.classList.remove("hidden");
    }

    function hideMessage(id) {
      $(id).classList.add("hidden");
    }

    async function api(url, options = {}) {
      const headers = {
        ...(options.body ? { "Content-Type": "application/json" } : {}),
        ...(options.method && options.method !== "GET"
          ? { "X-CSRF-Token": csrfToken } : {}),
        ...(options.headers || {})
      };

      const response = await fetch(url, {
        ...options,
        headers,
        credentials: "same-origin"
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || data.message || "Request failed");
      }

      return data;
    }

    async function checkLogin() {
      try {
        const data = await api("/api/admin/me");

        if (data.csrfToken) csrfToken = data.csrfToken;

        if (data.authenticated) {
          showDashboard();
        } else {
          showLogin();
        }
      } catch {
        showLogin();
      }
    }

    function showLogin() {
      $("loginSection").classList.remove("hidden");
      $("dashboard").classList.add("hidden");
    }

    function showDashboard() {
      $("loginSection").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
      loadProducts();
      loadOrders();
    }

    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      hideMessage("loginMessage");

      try {
        const result = await api("/api/admin/login", {
          method: "POST",
          body: JSON.stringify({
            username: $("username").value.trim(),
            password: $("password").value
          })
        });

        if (result.csrfToken) csrfToken = result.csrfToken;

        $("password").value = "";
        await checkLogin();
      } catch (error) {
        showMessage("loginMessage", error.message);
      }
    });

    $("logoutButton").addEventListener("click", async () => {
      try {
        await api("/api/admin/logout", { method: "POST" });
      } catch (error) {
        showMessage("dashboardMessage", error.message);
      }

      csrfToken = "";
      showLogin();
    });

    function resetProductForm() {
      $("productForm").reset();
      $("productId").value = "";
      $("productStock").value = "0";
      $("formHeading").textContent = "Add New Product";
      $("cancelEdit").classList.add("hidden");
    }

    $("cancelEdit").addEventListener("click", resetProductForm);

    $("productForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const id = $("productId").value;

      const product = {
        name: $("productName").value.trim(),
        price: Number($("productPrice").value),
        description: $("productDescription").value.trim(),
        image: $("productImage").value.trim(),
        back_Image: $("productBackImage").value.trim(),
        color: $("productColor").value.trim(),
        sizes: $("productSizes").value
          .split(",").map(s => s.trim()).filter(Boolean),
        stock: Number($("productStock").value)
      };

      try {
        if (id) {
          await api("/api/admin/products/" + encodeURIComponent(id), {
            method: "PUT",
            body: JSON.stringify(product)
          });
        } else {
          await api("/api/admin/products", {
            method: "POST",
            body: JSON.stringify(product)
          });
        }

        resetProductForm();
        showMessage("dashboardMessage", "Product saved successfully.");
        await loadProducts();
      } catch (error) {
        showMessage("dashboardMessage", error.message);
      }
    });

    async function loadProducts() {
      $("productsList").textContent = "Loading products...";

      try {
        const data = await api("/api/products");
        products = data.products || data;
        if (!Array.isArray(products)) products = [];

        renderProducts();
      } catch (error) {
        $("productsList").textContent =
          "Could not load products: " + error.message;
      }
    }

    function renderProducts() {
      const list = $("productsList");
      list.replaceChildren();

      if (!products.length) {
        list.textContent = "No products yet. Add your first product above.";
        return;
      }

      products.forEach((product) => {
        const card = document.createElement("article");
        card.className = "product";

        if (product.image) {
          const img = document.createElement("img");
          img.src = product.image;
          img.alt = product.name || "Product";
          img.loading = "lazy";
          img.onerror = () => img.remove();
          card.appendChild(img);
        }

        const title = document.createElement("h3");
        title.textContent = product.name || "Untitled product";
        card.appendChild(title);

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = "₹" + Number(product.price || 0).toLocaleString("en-IN");
        card.appendChild(price);

        const description = document.createElement("p");
        description.className = "muted";
        description.textContent = product.description || "";
        card.appendChild(description);

        const actions = document.createElement("div");
        actions.className = "actions";

        const edit = document.createElement("button");
        edit.className = "primary";
        edit.textContent = "Edit";
        edit.addEventListener("click", () => editProduct(product));

        const remove = document.createElement("button");
        remove.className = "danger";
        remove.textContent = "Delete";
        remove.addEventListener("click", () => deleteProduct(product.id));

        actions.append(edit, remove);
        card.appendChild(actions);
        list.appendChild(card);
      });
    }

    function editProduct(product) {
      $("productId").value = product.id;
      $("productName").value = product.name || "";
      $("productPrice").value = product.price ?? "";
      $("productDescription").value = product.description || "";
      $("productImage").value = product.image || "";
      $("productBackImage").value = product.backImage || "";
      $("productColor").value = product.color || "";
      $("productSizes").value = Array.isArray(product.sizes)
        ? product.sizes.join(", ")
        : (product.sizes || "");
      $("productStock").value = product.stock ?? 0;

      $("formHeading").textContent = "Edit Product";
      $("cancelEdit").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteProduct(id) {
      if (!confirm("Delete this product permanently?")) return;

      try {
        await api("/api/admin/products/" + encodeURIComponent(id), {
          method: "DELETE"
        });
        showMessage("dashboardMessage", "Product deleted.");
        await loadProducts();
      } catch (error) {
        showMessage("dashboardMessage", error.message);
      }
    }

    $("refreshOrders").addEventListener("click", loadOrders);

    async function loadOrders() {
      $("ordersList").textContent = "Loading orders...";

      try {
        const data = await api("/api/admin/orders");
        const orders = data.orders || data;
        renderOrders(Array.isArray(orders) ? orders : []);
      } catch (error) {
        $("ordersList").textContent =
          "Could not load orders: " + error.message;
      }
    }

    function renderOrders(orders) {
      const list = $("ordersList");
      list.replaceChildren();

      if (!orders.length) {
        list.textContent = "No orders found.";
        return;
      }

      orders.forEach((order) => {
        const card = document.createElement("article");
        card.className = "order";

        const heading = document.createElement("h3");
        heading.textContent = "Order #" + (order.id ?? order.orderCode ?? "");
        card.appendChild(heading);

        const details = document.createElement("p");
        details.className = "muted";
        details.textContent =
          "Customer: " + (order.customerName || order.name || "—") +
          "\nPhone: " + (order.phone || "—") +
          "\nAddress: " + (order.address || "—") +
          "\nPayment: " + (order.paymentMethod || order.payment_method || "—") +
          "\nStatus: " + (order.status || "pending") +
          "\nTotal: ₹" + Number(order.total || 0).toLocaleString("en-IN");

        details.style.whiteSpace = "pre-line";
        card.appendChild(details);

        if (order.items) {
          const items = document.createElement("p");
          items.className = "muted";
          items.textContent = "Items: " +
            (typeof order.items === "string"
              ? order.items
              : JSON.stringify(order.items));
          card.appendChild(items);
        

        const select = document.createElement("select");
        ["NEW", "CONFIRMED", "PACKED", "SHIPPED", "DELIVERED", "CANCELLED"]
          .forEach(status => {
            const option = document.createElement("option");
            option.value = status;
            option.textContent = status;
            option.selected = status === (order.status || "pending");
            select.appendChild(option);
          });

        const update = document.createElement("button");
        update.className = "primary";
        update.textContent = "Update Status";
        update.addEventListener("click", async () => {
          try {
            await api("/api/admin/orders/" +
              encodeURIComponent(order.id) + "/status", {
                method: "PATCH",
                body: JSON.stringify({ status: select.value })
              });
            showMessage("dashboardMessage", "Order status updated.");
            await loadOrders();
          } catch (error) {
            showMessage("dashboardMessage", error.message);
          }
        });

        card.append(select, update);
        list.appendChild(card);
      });
    }

    checkLogin();
  </script>
</body>
  </html>
