<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>AURAIC | Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071426;
      color: #fff;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      margin: 7px 0 15px;
      padding: 12px;
      border: 1px solid #30435d;
      border-radius: 8px;
      background: #101f33;
      color: #fff;
    }

    label {
      font-size: 13px;
      color: #b8c8dd;
    }

    .primary {
      background: #58a6ff;
      color: #061426;
    }

    .secondary {
      background: #24364d;
      color: #fff;
    }

    .danger {
      background: #ff5364;
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
      padding: 25px 0 60px;
    }

    .brand {
      color: #58a6ff;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .muted {
      color: #9aacc4;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .card {
      margin-top: 22px;
      padding: 22px;
      border: 1px solid #24364d;
      border-radius: 14px;
      background: #0d1b2e;
    }

    .login {
      max-width: 430px;
      margin: 70px auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .product, .order {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid #30435d;
      border-radius: 10px;
      background: #101f33;
      overflow-wrap: anywhere;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: white;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .price {
      color: #75b7ff;
      font-size: 20px;
      font-weight: bold;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 12px;
    }

    .message {
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      background: #132a43;
      color: #b8d9ff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
      }

      .card {
        padding: 16px;
      }

      .login {
        margin-top: 35px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- ADMIN LOGIN -->
    <section id="loginSection" class="card login">
      <div class="brand">AURAIC</div>
      <p class="muted">SECURE ADMIN ACCESS</p>

      <form id="loginForm">
        <label for="username">Admin username</label>
        <input id="username" autocomplete="username" required>

        <label for="password">Admin password</label>
        <input id="password" type="password"
               autocomplete="current-password" required>

        <button class="primary" type="submit" style="width:100%">
          LOGIN
        </button>
      </form>

      <div id="loginMessage" class="message hidden"></div>
    </section>

    <!-- ADMIN DASHBOARD -->
    <section id="dashboard" class="hidden">
      <header class="topbar">
        <div>
          <div class="brand">AURAIC</div>
          <p class="muted">ADMIN DASHBOARD</p>
        </div>

        <button id="logoutButton" class="danger">Logout</button>
      </header>

      <div id="dashboardMessage" class="message hidden"></div>

      <!-- ADD / EDIT PRODUCT -->
      <section class="card">
        <h2 id="formHeading">Add Product</h2>

        <form id="productForm">
          <input id="productId" type="hidden">

          <label for="productName">Product name *</label>
          <input id="productName" maxlength="120" required>

          <label for="productPrice">Price (₹) *</label>
          <input id="productPrice" type="number"
                 min="0.01" step="0.01" required>

          <label for="productDescription">Description</label>
          <textarea id="productDescription" rows="3"
                    maxlength="2000"></textarea>

          <label for="productImage">Front Photo *</label>
<input
    id="productImage"
    type="file"
    accept="image/*"
    required
>

<img id="frontPreview"
     style="width:120px;display:none;margin-bottom:15px;">

<label for="productBackImage">Back Photo</label>
<input
    id="productBackImage"
    type="file"
    accept="image/*"
>

<img id="backPreview"
     style="width:120px;display:none;margin-bottom:15px;">

          <label for="productBackImage">Back image URL</label>
          <input id="productBackImage" type="url" maxlength="1000"
                 placeholder="https://example.com/back.jpg">

          <label for="productColor">Colour</label>
          <input id="productColor" maxlength="100">

          <label for="productSizes">Sizes (comma-separated)</label>
          <input id="productSizes" maxlength="200"
                 placeholder="S, M, L, XL">

          <label for="productStock">Stock quantity *</label>
          <input id="productStock" type="number" min="0"
                 step="1" value="0" required>

          <div class="actions">
            <button class="primary" type="submit">Save Product</button>
            <button id="cancelEdit" class="secondary hidden"
                    type="button">Cancel Edit</button>
          </div>
        </form>
      </section>

      <!-- PRODUCTS -->
      <section class="card">
        <h2>Products</h2>
        <button id="refreshProducts" class="secondary" type="button">
          Refresh Products
        </button>
        <div id="productsList" class="muted">Loading products...</div>
      </section>

      <!-- ORDERS -->
      <section class="card">
        <h2>Customer Orders</h2>
        <button id="refreshOrders" class="secondary" type="button">
          Refresh Orders
        </button>
        <div id="ordersList" class="muted">Loading orders...</div>
      </section>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    let products = [];
    // AURAIC CLOUDINARY IMAGE UPLOAD

const CLOUD_NAME = "vdqrpjye";
const UPLOAD_PRESET = "auraic_upload";

async function uploadToCloudinary(file) {

    if (!file) return "";

    if (!file.type.startsWith("image/")) {
        throw new Error("Please select an image.");
    }

    if (file.size > 5 * 1024 * 1024) {
        throw new Error("Image must be smaller than 5 MB.");
    }

    const formData = new FormData();

    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);
    formData.append("folder", "auraic-products");

    const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        {
            method: "POST",
            body: formData
        }
    );

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.error?.message || "Image upload failed.");
    }

    return data.secure_url;
}


// IMAGE PREVIEW

function previewImage(inputId, previewId) {

    $(inputId).addEventListener("change", event => {

        const file = event.target.files[0];
        const preview = $(previewId);

        if (!file) return;

        preview.src = URL.createObjectURL(file);
        preview.classList.remove("hidden");

    });
}

previewImage("productImage", "frontPreview");
previewImage("productBackImage", "backPreview");

    async function api(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        credentials: "same-origin",
        headers: {
          ...(options.body
            ? { "Content-Type": "application/json" }
            : {}),
          ...(options.headers || {})
        }
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "Request failed.");
      }

      return data;
    }

    function message(id, text) {
      $(id).textContent = text;
      $(id).classList.remove("hidden");
    }

    function clearMessage(id) {
      $(id).textContent = "";
      $(id).classList.add("hidden");
    }

    function showLogin() {
      $("loginSection").classList.remove("hidden");
      $("dashboard").classList.add("hidden");
    }

    function showDashboard() {
      $("loginSection").classList.add("hidden");
      $("dashboard").classList.remove("hidden");

      loadProducts();
      loadOrders();
    }

    async function checkLogin() {
      try {
        const data = await api("/api/admin/me");

        if (data.authenticated === true) {
          showDashboard();
        } else {
          showLogin();
        }
      } catch {
        showLogin();
      }
    }

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      clearMessage("loginMessage");

      try {
        await api("/api/admin/login", {
          method: "POST",
          body: JSON.stringify({
            username: $("username").value.trim(),
            password: $("password").value
          })
        });

        $("password").value = "";
        await checkLogin();
      } catch (error) {
        message("loginMessage", error.message);
      }
    });

    $("logoutButton").addEventListener("click", async () => {
      try {
        await api("/api/admin/logout", { method: "POST" });
      } catch (error) {
        message("dashboardMessage", error.message);
      }

      showLogin();
    });

    function resetProductForm() {
      $("productForm").reset();
      $("productId").value = "";
      $("productStock").value = "0";
      $("formHeading").textContent = "Add Product";
      $("cancelEdit").classList.add("hidden");
    }

    $("cancelEdit").addEventListener("click", resetProductForm);
    $("refreshProducts").addEventListener("click", loadProducts);
    $("refreshOrders").addEventListener("click", loadOrders);

    // CREATE / UPDATE PRODUCT
    $("productForm").addEventListener("submit", async event => {
      event.preventDefault();
      clearMessage("dashboardMessage");

      const id = $("productId").value;

      const product = {
        name: $("productName").value.trim(),
        description: $("productDescription").value.trim(),
        price: Number($("productPrice").value),
        image: $("productImage").value.trim(),
        back_image: $("productBackImage").value.trim(),
        color: $("productColor").value.trim(),
        sizes: $("productSizes").value
          .split(",").map(value => value.trim()).filter(Boolean),
        stock: Number($("productStock").value)
      };

      try {
        const url = id
          ? "/api/admin/products/" + encodeURIComponent(id)
          : "/api/admin/products";

        await api(url, {
          method: id ? "PUT" : "POST",
          body: JSON.stringify(product)
        });

        resetProductForm();
        message("dashboardMessage", "Product saved successfully.");
        await loadProducts();
      } catch (error) {
        message("dashboardMessage", error.message);
      }
    });

    // LOAD PRODUCTS
    async function loadProducts() {
      $("productsList").textContent = "Loading products...";

      try {
        const data = await api("/api/products");
        products = Array.isArray(data.products)
          ? data.products
          : Array.isArray(data) ? data : [];

        renderProducts();
      } catch (error) {
        $("productsList").textContent =
          "Could not load products: " + error.message;
      }
    }

    function renderProducts() {
      const list = $("productsList");
      list.replaceChildren();

      if (!products.length) {
        list.textContent = "No active products found.";
        return;
      }

      products.forEach(product => {
        const card = document.createElement("article");
        card.className = "product";

        if (product.image) {
          const img = document.createElement("img");
          img.src = product.image;
          img.alt = product.name || "Product";
          img.loading = "lazy";
          img.onerror = () => img.remove();
          card.appendChild(img);
        }

        const title = document.createElement("h3");
        title.textContent = product.name || "Untitled product";

        const price = document.createElement("p");
        price.className = "price";
        price.textContent =
          "₹" + Number(product.price || 0).toLocaleString("en-IN");

        const details = document.createElement("p");
        details.className = "muted";
        details.textContent =
          (product.description || "") +
          "\nColour: " + (product.color || "—") +
          "\nSizes: " + (
            Array.isArray(product.sizes)
              ? product.sizes.join(", ")
              : product.sizes || "—"
          ) +
          "\nStock: " + (product.stock ?? 0);

        const actions = document.createElement("div");
        actions.className = "actions";

        const edit = document.createElement("button");
        edit.className = "primary";
        edit.textContent = "Edit";
        edit.addEventListener("click", () => editProduct(product));

        const remove = document.createElement("button");
        remove.className = "danger";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => deleteProduct(product.id));

        actions.append(edit, remove);
        card.append(title, price, details, actions);
        list.appendChild(card);
      });
    }

    function editProduct(product) {
      $("productId").value = product.id;
      $("productName").value = product.name || "";
      $("productPrice").value = product.price ?? "";
      $("productDescription").value = product.description || "";
      $("productImage").value = product.image || "";
      $("productBackImage").value = product.back_image || "";
      $("productColor").value = product.color || "";

      $("productSizes").value = Array.isArray(product.sizes)
        ? product.sizes.join(", ")
        : product.sizes || "";

      $("productStock").value = product.stock ?? 0;
      $("formHeading").textContent = "Edit Product";
      $("cancelEdit").classList.remove("hidden");

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // SOFT DELETE PRODUCT
    async function deleteProduct(id) {
      if (!confirm("Remove this product from the store?")) return;

      try {
        await api("/api/admin/products/" + encodeURIComponent(id), {
          method: "DELETE"
        });

        message("dashboardMessage", "Product removed.");
        await loadProducts();
      } catch (error) {
        message("dashboardMessage", error.message);
      }
    }

    // LOAD ORDERS
    async function loadOrders() {
      $("ordersList").textContent = "Loading orders...";

      try {
        const data = await api("/api/admin/orders");
        const orders = Array.isArray(data.orders) ? data.orders : [];
        renderOrders(orders);
      } catch (error) {
        $("ordersList").textContent =
          "Could not load orders: " + error.message;
      }
    }

    // DISPLAY ORDERS + STATUS UPDATE
    function renderOrders(orders) {
      const list = $("ordersList");
      list.replaceChildren();

      if (!orders.length) {
        list.textContent = "No customer orders found.";
        return;
      }

      const statuses = [
        "NEW",
        "CONFIRMED",
        "PACKED",
        "SHIPPED",
        "DELIVERED",
        "CANCELLED"
      ];

      orders.forEach(order => {
        const card = document.createElement("article");
        card.className = "order";

        const title = document.createElement("h3");
        title.textContent =
          "Order " + (order.order_code || ("#" + order.id));

        const details = document.createElement("p");
        details.className = "muted";
        details.textContent =
          "Customer: " + (order.customer_name || "—") +
          "\nPhone: " + (order.phone || "—") +
          "\nAddress: " + (order.address || "—") +
          "\nPayment method: " + (order.payment_method || "—") +
          "\nPayment status: " + (order.payment_status || "PENDING") +
          "\nOrder status: " + (order.order_status || "NEW") +
          "\nTotal: ₹" +
          Number(order.total || 0).toLocaleString("en-IN");

        const items = document.createElement("p");
        items.className = "muted";

        const orderItems = Array.isArray(order.items)
          ? order.items
          : Array.isArray(order.items_json)
            ? order.items_json
            : [];

        items.textContent = "Items: " + orderItems.map(item =>
          `${item.name} × ${item.quantity}`
        ).join(", ");

        const select = document.createElement("select");

        statuses.forEach(status => {
          const option = document.createElement("option");
          option.value = status;
          option.textContent = status;
          option.selected = status === (order.order_status || "NEW");
          select.appendChild(option);
        });

        const update = document.createElement("button");
        update.className = "primary";
        update.textContent = "Update Status";

        update.addEventListener("click", async () => {
          try {
            await api(
              "/api/admin/orders/" +
              encodeURIComponent(order.id) + "/status",
              {
                method: "PATCH",
                body: JSON.stringify({ status: select.value })
              }
            );

            message("dashboardMessage", "Order status updated.");
            await loadOrders();
          } catch (error) {
            message("dashboardMessage", error.message);
          }
        });

        card.append(title, details, items, select, update);
        list.appendChild(card);
      });
    }

    checkLogin();
  </script>
</body>
</html>
